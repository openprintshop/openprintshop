<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OpenPrintShop — LCD 1920×480</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --acc: #ff3548;
    --glowf: 0.6;
    --bg: #050608;
    --card: rgba(255, 255, 255, 0.025);
    --line: rgba(255, 255, 255, 0.07);
    --text: #f2f4f8;
    --muted: #8b93a1;
    --faint: #565e6b;
    --hot: #ff3d2e;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    --sans: 'Onest', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
  body { font-family: var(--sans); color: var(--text); }

  /* ── стейдж 1920×480, масштабируется под вьюпорт ── */
  #viewport { position: fixed; inset: 0; background: #000; }
  #stage {
    position: absolute; left: 50%; top: 50%; width: 1920px; height: 480px;
    background: var(--bg); overflow: hidden;
  }
  /* фоновое красное свечение — как подсветка в корпусе */
  #stage::before {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(900px 420px at 88% -20%, color-mix(in oklab, var(--acc) 13%, transparent), transparent 70%),
      radial-gradient(700px 380px at 4% 120%, color-mix(in oklab, var(--acc) 9%, transparent), transparent 70%),
      radial-gradient(1200px 600px at 50% 50%, transparent 55%, rgba(0,0,0,0.5));
  }
  #stage::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; opacity: 0.5;
    background: repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,0.12) 3px 4px);
  }

  /* органический плавающий фон */
  .amb { position: absolute; pointer-events: none; z-index: 1; border-radius: 50%; opacity: calc(0.45 + 0.55 * var(--glowf)); }
  .amb1 {
    width: 1050px; height: 660px; left: -220px; top: -280px;
    background: radial-gradient(closest-side, color-mix(in oklab, var(--acc) 13%, transparent), transparent);
    animation: drift1 38s ease-in-out infinite alternate;
  }
  .amb2 {
    width: 920px; height: 580px; right: -240px; bottom: -320px;
    background: radial-gradient(closest-side, color-mix(in oklab, var(--acc) 10%, transparent), transparent);
    animation: drift2 47s ease-in-out infinite alternate;
  }
  @keyframes drift1 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(460px, 70px) scale(1.18); }
    100% { transform: translate(940px, -50px) scale(0.94); }
  }
  @keyframes drift2 {
    0% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-400px, -60px) scale(1.14); }
    100% { transform: translate(-860px, 40px) scale(1); }
  }
  [data-amb="off"] .amb { display: none; }

  .wrap { position: relative; z-index: 2; height: 100%; padding: 22px 30px 26px; display: flex; flex-direction: column; gap: 16px; }

  /* ── шапка ── */
  .topbar { display: flex; align-items: center; gap: 18px; height: 50px; }
  .wordmark { font: 800 30px/1 var(--mono); letter-spacing: 0.04em; }
  .wordmark .dot { color: var(--acc); text-shadow: 0 0 calc(18px * var(--glowf)) var(--acc); }
  .livechip {
    display: flex; align-items: center; gap: 9px; padding: 7px 16px 7px 13px; border-radius: 100px;
    border: 1px solid color-mix(in oklab, var(--acc) 45%, transparent);
    background: color-mix(in oklab, var(--acc) 10%, transparent);
    font: 700 16px/1 var(--mono); letter-spacing: 0.14em; color: var(--acc);
  }
  .livechip i {
    width: 9px; height: 9px; border-radius: 50%; background: var(--acc); flex: none;
    box-shadow: 0 0 calc(12px * var(--glowf)) var(--acc);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.72); } }
  .topspacer { flex: 1; }
  .date { font: 600 22px/1 var(--mono); color: var(--muted); letter-spacing: 0.06em; }
  .clock { font: 800 42px/1 var(--mono); letter-spacing: 0.03em; }
  .clock .colon { animation: blink 2s steps(1) infinite; color: var(--acc); }
  @keyframes blink { 50% { opacity: 0.25; } }

  /* ── карточки ── */
  .grid { flex: 1; display: grid; grid-template-columns: 1fr 420px 510px; gap: 20px; min-height: 0; }
  .grid.wide { grid-template-columns: 1fr 950px; }
  .card {
    position: relative; border-radius: 22px; border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.008));
    padding: 22px 26px; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; inset: 0 0 auto 0; height: 1px; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
  }
  .boot .card { animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
  .boot .card:nth-child(2) { animation-delay: 0.1s; }
  .boot .card:nth-child(3) { animation-delay: 0.2s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card, .amb, .livechip i { animation: none !important; } }

  .cardlab { font: 700 15px/1 var(--mono); letter-spacing: 0.22em; color: var(--faint); text-transform: uppercase; }

  /* ── зона принтера ── */
  .printcard { display: flex; gap: 30px; align-items: center; }
  .gaugebox { position: relative; width: 312px; height: 312px; flex: none; align-self: center; }
  .ring-svg { position: absolute; inset: 0; }
  .ring-track { stroke: rgba(255,255,255,0.06); }
  .ring-fill {
    stroke: var(--acc); stroke-linecap: round;
    filter: drop-shadow(0 0 calc(13px * var(--glowf)) color-mix(in oklab, var(--acc) 85%, transparent));
    transition: stroke-dashoffset 1.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .tick { stroke: rgba(255,255,255,0.1); transition: stroke 0.6s; }
  .tick.lit { stroke: color-mix(in oklab, var(--acc) 75%, transparent); }
  .tipdot { filter: drop-shadow(0 0 calc(10px * var(--glowf)) var(--acc)); transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1); }
  .ringcenter {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px;
    text-align: center;
  }
  .pct { font: 800 78px/0.95 var(--mono); letter-spacing: -0.02em; }
  .pct small { font-size: 40px; color: var(--acc); }
  .layerline { font: 600 19px/1 var(--mono); color: var(--muted); }

  /* слои (альтернативный вид) */
  .layersbox { display: flex; align-items: center; gap: 26px; width: 312px; height: 312px; flex: none; }
  .layerstack { position: relative; width: 168px; height: 272px; display: flex; flex-direction: column-reverse; align-items: center; gap: 3px; }
  .plate { position: absolute; bottom: -10px; left: -12px; right: -12px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.16); }
  .layer { height: 9px; border-radius: 3px; background: rgba(255,255,255,0.055); transition: background 0.5s, box-shadow 0.5s; }
  .layer.done { background: color-mix(in oklab, var(--acc) 72%, #1a0508); }
  .layer.active {
    position: relative; background: var(--acc);
    box-shadow: 0 0 calc(14px * var(--glowf)) color-mix(in oklab, var(--acc) 80%, transparent);
  }
  .layer.active .head {
    position: absolute; top: 50%; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; transform: translate(-50%, -50%);
    box-shadow: 0 0 calc(12px * var(--glowf)) #fff, 0 0 calc(22px * var(--glowf)) var(--acc);
    animation: sweep 1.5s ease-in-out infinite alternate;
  }
  @keyframes sweep { from { left: 7%; } to { left: 93%; } }
  .layerstack.full .layer.done {
    background: var(--acc);
    box-shadow: 0 0 calc(9px * var(--glowf)) color-mix(in oklab, var(--acc) 55%, transparent);
  }
  .layerstack.full { animation: donebreathe 2.6s ease-in-out infinite; }
  @keyframes donebreathe { 50% { filter: brightness(1.22); } }
  .layerspct { display: flex; flex-direction: column; gap: 6px; }
  .layerspct .layerline { white-space: nowrap; font-size: 17px; }

  .printinfo { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px; }
  .stateline { display: flex; align-items: center; gap: 14px; }
  .statechip {
    font: 800 16px/1 var(--mono); letter-spacing: 0.18em; padding: 8px 16px; border-radius: 100px;
    color: var(--acc); border: 1px solid color-mix(in oklab, var(--acc) 55%, transparent);
    background: color-mix(in oklab, var(--acc) 12%, transparent); text-transform: uppercase;
    text-shadow: 0 0 calc(14px * var(--glowf)) color-mix(in oklab, var(--acc) 70%, transparent);
    animation: pulse 2.2s ease-in-out infinite;
  }
  .statechip.idle { color: var(--muted); border-color: var(--line); background: rgba(255,255,255,0.03); text-shadow: none; animation: none; }
  .donebox {
    display: flex; align-items: center; gap: 20px; padding: 18px 22px; border-radius: 16px;
    border: 1px solid color-mix(in oklab, var(--acc) 45%, transparent);
    background: color-mix(in oklab, var(--acc) 8%, transparent);
  }
  .dcheck {
    width: 58px; height: 58px; border-radius: 50%; flex: none; display: grid; place-items: center;
    color: #fff; background: var(--acc);
    box-shadow: 0 0 calc(26px * var(--glowf)) color-mix(in oklab, var(--acc) 75%, transparent);
    animation: popin 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes popin { from { transform: scale(0.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .donebox .t { font: 700 25px/1.2 var(--sans); }
  .donebox .s { font: 500 17px/1.3 var(--sans); color: var(--muted); margin-top: 4px; }
  .idlebox { display: flex; flex-direction: column; gap: 6px; }
  .idlebox .t { font: 600 23px/1.3 var(--sans); color: var(--muted); }
  .idlebox .s { font: 500 16px/1.3 var(--sans); color: var(--faint); }
  .filename {
    font: 700 31px/1.25 var(--sans); letter-spacing: 0.01em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    text-wrap: pretty;
  }
  .metarow { display: flex; gap: 36px; }
  .meta { display: flex; flex-direction: column; gap: 6px; }
  .meta .l { font: 600 15px/1 var(--mono); letter-spacing: 0.16em; color: var(--faint); text-transform: uppercase; }
  .meta .v { font: 700 30px/1 var(--mono); }
  .meta .v em { font-style: normal; color: var(--muted); font-size: 21px; }

  .temps { display: flex; gap: 30px; }
  .temp { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .temp .trow { display: flex; align-items: baseline; gap: 10px; }
  .temp .tl { font: 600 15px/1 var(--mono); letter-spacing: 0.14em; color: var(--faint); text-transform: uppercase; }
  .temp .tv { font: 700 26px/1 var(--mono); margin-left: auto; }
  .temp .tt { font: 600 16px/1 var(--mono); color: var(--faint); }
  .tbar { height: 7px; border-radius: 4px; background: rgba(255,255,255,0.06); overflow: hidden; }
  .tbar i {
    display: block; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, color-mix(in oklab, var(--acc) 55%, #3a0a10), var(--acc), #ff9d6b);
    background-size: 200% 100%; animation: heat 3s linear infinite;
    box-shadow: 0 0 calc(10px * var(--glowf)) color-mix(in oklab, var(--acc) 60%, transparent);
    transition: width 1.2s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes heat { from { background-position: 0% 0; } to { background-position: 200% 0; } }

  /* ── очередь печати (простой) ── */
  .queuecard { display: flex; flex-direction: column; gap: 14px; }
  .qhead { display: flex; align-items: center; gap: 14px; }
  .qcount { margin-left: auto; font: 700 17px/1 var(--mono); letter-spacing: 0.06em; color: var(--muted); }
  .qcount b { color: var(--text); font-size: 20px; }
  .qlist { flex: 1; display: flex; flex-direction: column; gap: 8px; justify-content: flex-start; }
  .qrow {
    display: flex; align-items: center; gap: 18px; padding: 8px 18px; border-radius: 14px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.015);
  }
  .qrow.next { border-color: color-mix(in oklab, var(--acc) 45%, transparent); background: color-mix(in oklab, var(--acc) 8%, transparent); }
  .qidx {
    width: 42px; height: 42px; border-radius: 12px; flex: none; display: grid; place-items: center;
    font: 800 19px/1 var(--mono); color: var(--faint); background: rgba(255,255,255,0.05);
  }
  .qrow.next .qidx { color: #fff; background: var(--acc); box-shadow: 0 0 calc(16px * var(--glowf)) color-mix(in oklab, var(--acc) 65%, transparent); }
  .qmain { flex: 1; min-width: 0; }
  .qtitle { font: 700 21px/1.15 var(--sans); display: flex; align-items: baseline; gap: 10px; }
  .qqty { font: 700 16px/1 var(--mono); color: var(--muted); }
  .qsub { font: 500 15px/1.25 var(--sans); color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qchip {
    display: flex; align-items: center; gap: 8px; flex: none; font: 700 15px/1 var(--mono);
    color: var(--muted); padding: 8px 14px; border-radius: 100px; border: 1px solid var(--line); background: rgba(255,255,255,0.02);
  }
  .qchip i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .qmeta { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; min-width: 150px; }
  .qwait { font: 800 21px/1 var(--mono); color: var(--muted); white-space: nowrap; }
  .qrow.next .qwait { color: var(--acc); text-shadow: 0 0 calc(14px * var(--glowf)) color-mix(in oklab, var(--acc) 60%, transparent); }
  .qest { font: 600 15px/1 var(--mono); color: var(--faint); white-space: nowrap; }
  .qmore { font: 600 16px/1 var(--mono); color: var(--faint); letter-spacing: 0.04em; padding: 5px 6px 0; }
  .qfoot { display: flex; align-items: baseline; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
  .qfoot .l { font: 600 14px/1 var(--mono); letter-spacing: 0.14em; color: var(--faint); text-transform: uppercase; }
  .qfoot .v { margin-left: auto; font: 700 21px/1 var(--mono); }

  /* ── уведомления ── */
  .alertcard { display: flex; flex-direction: column; gap: 14px; }
  .alertcard.hasalerts { border-color: color-mix(in oklab, var(--acc) 40%, transparent); animation: alertglow 2.6s ease-in-out 0.8s infinite; }
  @keyframes alertglow {
    0%, 100% { box-shadow: 0 0 0 0 transparent; }
    50% { box-shadow: 0 0 calc(34px * var(--glowf)) calc(2px * var(--glowf)) color-mix(in oklab, var(--acc) 22%, transparent); }
  }
  .alertrows { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .alertrow {
    display: flex; align-items: center; gap: 18px; padding: 16px 20px; border-radius: 16px;
    border: 1px solid var(--line); background: rgba(255,255,255,0.018);
    transition: border-color 0.5s, background 0.5s;
  }
  .alertrow.on { border-color: color-mix(in oklab, var(--acc) 50%, transparent); background: color-mix(in oklab, var(--acc) 7%, transparent); }
  .aicon { width: 46px; height: 46px; border-radius: 13px; flex: none; display: grid; place-items: center; background: rgba(255,255,255,0.05); color: var(--faint); }
  .alertrow.on .aicon { background: color-mix(in oklab, var(--acc) 18%, transparent); color: var(--acc); animation: pulse 2s ease-in-out infinite; }
  .atext { flex: 1; min-width: 0; }
  .atext .t { font: 700 21px/1.2 var(--sans); }
  .atext .s { font: 500 16px/1.3 var(--sans); color: var(--muted); margin-top: 3px; }
  .acount { font: 800 44px/1 var(--mono); color: var(--faint); }
  .alertrow.on .acount { color: var(--acc); text-shadow: 0 0 calc(16px * var(--glowf)) color-mix(in oklab, var(--acc) 70%, transparent); }
  .allclear { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--faint); }
  .allclear .ok {
    width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.14);
    display: grid; place-items: center; color: var(--muted);
  }
  .allclear .m { font: 600 19px/1 var(--sans); color: var(--muted); }
  .allclear .s { font: 500 15px/1 var(--sans); }

  /* ── система · телеметрия ── */
  .syscard { display: flex; flex-direction: column; gap: 12px; }
  .telem { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .graphs { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 1; min-height: 0; }
  .gpanel {
    position: relative; border: 1px solid var(--line); border-radius: 14px;
    background: rgba(255,255,255,0.015); overflow: hidden; padding: 12px 14px 8px;
    display: flex; flex-direction: column;
  }
  .gtop { display: flex; align-items: baseline; gap: 9px; }
  .gtitle { font: 700 14px/1 var(--mono); letter-spacing: 0.2em; color: var(--faint); }
  .gtemp { font: 700 17px/1 var(--mono); color: var(--muted); }
  .gbig { margin-left: auto; font: 800 30px/1 var(--mono); }
  .gbig em { font-style: normal; font-size: 16px; color: var(--muted); }
  .gsvg { flex: 1; width: 100%; min-height: 0; margin-top: 6px; }
  .meters { display: flex; gap: 18px; }
  .meter { flex: 1; }
  .mtop { display: flex; align-items: baseline; gap: 8px; margin-bottom: 7px; }
  .mname { font: 700 14px/1 var(--mono); letter-spacing: 0.16em; color: var(--faint); }
  .mval { margin-left: auto; font: 800 22px/1 var(--mono); }
  .mtrack { height: 11px; border-radius: 6px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .mfill { height: 100%; border-radius: 6px; transition: width 0.6s ease, background 0.5s; }
  /* широкий режим (тихий) — крупнее */
  .telem.wide .gbig { font-size: 42px; }
  .telem.wide .gbig em { font-size: 21px; }
  .telem.wide .gtemp { font-size: 23px; }
  .telem.wide .gtitle { font-size: 16px; }
  .telem.wide .mval { font-size: 27px; }
  .telem.wide .mname { font-size: 16px; }
  .telem.wide .mtrack { height: 14px; }
  .telem.wide .meters { gap: 30px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="dashboard.jsx"></script>
  <script src="lcd-feed.js"></script>
</body>
