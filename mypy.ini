[mypy]
python_version = 3.13
ignore_missing_imports = True
check_untyped_defs = False
warn_return_any = False
warn_unused_ignores = False
# union-attr: ложноположительные от aiogram (cb.message: Message|None|Inaccessible — но в наших
# хендлерах всегда Message) и aiohttp multipart — рантайм-безопасно.
disable_error_code = annotation-unchecked, union-attr
exclude = (^data/|[\\/]\.venv[\\/]|^tests/|_build_)

# Хендлеры aiogram: cb.bot/cb.message/message.text помечены Optional, хотя фильтры гарантируют
# их наличие — типизация без пользы и с большим шумом. Проверяем постепенно; ядро-логика — ниже.
[mypy-app.handlers.*]
ignore_errors = True

# db.py: aiosqlite Row|None при COUNT/fetchone и lastrowid: int|None — рантайм всегда даёт значение.
[mypy-app.db]
disable_error_code = index, return-value

# app/store/*: те же тела, что и в db.py, переезжающие волнами разреза (план
# refactoring-db-plan-2026-08-21.md) — тот же aiosqlite-шум и то же послабление. Без этой
# секции дословный перенос сам по себе ломал бы mypy-паритет (волна 2: +16 ошибок на ровном месте).
[mypy-app.store.*]
disable_error_code = index, return-value

# preview.py: пробелы в стабах Pillow (Image.LANCZOS/FASTOCTREE — валидные алиасы enum) и trimesh.
[mypy-app.preview]
disable_error_code = attr-defined, index, operator, return-value
