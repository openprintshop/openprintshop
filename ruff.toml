line-length = 120
target-version = "py313"
exclude = [".venv", "data"]

[lint]
select = ["E", "F", "W", "I"]
# E501 — длинные строки (много кириллических комментариев);
# E741 — однобуквенные имена в коротких лямбдах/циклах;
# E702 — компактные numpy-строчки через ; в растеризаторе (рабочий код, не трогаем).
ignore = ["E501", "E741", "E702"]
